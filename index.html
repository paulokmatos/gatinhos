<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#EEF3EC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gatinhos" />
    <link rel="icon" href="/gatinhos/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/gatinhos/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <title>Gatinhos</title>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <radialGradient id="k-fur" cx="42%" cy="30%" r="75%"><stop offset="0%" stop-color="#4C4C55"/><stop offset="60%" stop-color="#26262B"/><stop offset="100%" stop-color="#121215"/></radialGradient>
        <radialGradient id="k-white" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#D9D9E2"/></radialGradient>
        <radialGradient id="k-ear" cx="50%" cy="70%" r="70%"><stop offset="0%" stop-color="#F8BFCB"/><stop offset="100%" stop-color="#D98599"/></radialGradient>
        <radialGradient id="k-iris" cx="45%" cy="40%" r="60%"><stop offset="0%" stop-color="#3C3C46"/><stop offset="100%" stop-color="#0B0B0F"/></radialGradient>
      </defs>
    </svg>
    <div id="app">
      <div class="top">
        <button id="restart" class="round" aria-label="Recomeçar nível" title="Recomeçar nível">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" stroke="#2F6B5E" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="titles"><span id="title">Gatinhos</span><span id="sub"></span></div>
        <button id="symbols" class="round" aria-label="Mostrar símbolos nas cores" title="Símbolos" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 4l7 8-7 8-7-8z" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="rules"><div>1 gatinho por cor</div><div>1 por linha e coluna</div><div>Não podem se encostar</div></div>
      <div class="status">
        <div id="progress" class="dots" aria-label="Cores com gatinho achado"></div>
        <span id="found"></span>
      </div>
      <div class="status">
        <span id="missing" class="missing"></span>
        <div id="tries" class="tries" role="img"></div>
      </div>
      <div id="board" role="grid" aria-label="Tabuleiro"></div>
      <p id="tip" class="tip">1 toque anota ✕ · 2 toques seguidos dão um palpite</p>
      <div id="hint" hidden></div>
      <div class="spacer"></div>
      <div class="bar">
        <button id="undo" class="pill white" aria-label="Desfazer">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 14 L4 9 L9 4 M4 9 H14 A6 6 0 0 1 14 21 H10" stroke="#2F6B5E" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Desfazer
        </button>
        <button id="hintBtn" class="pill orange">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 18 H15 M10 21 H14 M12 3 A6 6 0 0 0 8.5 13.8 V16 H15.5 V13.8 A6 6 0 0 0 12 3 Z" stroke="#FFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Dica
        </button>
        <button id="powersBtn" class="round big power" aria-label="Poderes">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z" fill="currentColor"/></svg>
          <span id="powerCount" class="badge">0</span>
        </button>
        <button id="redo" class="round big" aria-label="Refazer">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 14 L20 9 L15 4 M20 9 H10 A6 6 0 0 0 10 21 H14" stroke="#2F6B5E" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="toast" class="toast" role="status" hidden></div>
      <div id="sheet" hidden></div>
      <div id="overlay" hidden></div>
    </div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>

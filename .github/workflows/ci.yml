name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Pular os testes'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Testes: pule com "[skip tests]" na mensagem do commit, label "skip-tests" no PR
  # ou a opção "Pular os testes" ao rodar manualmente. O build/deploy nunca depende de eles rodarem.
  test:
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.head_commit.message, '[skip tests]') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-tests') &&
      !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    # roda mesmo se os testes foram pulados; só falha se os testes rodaram e falharam
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
